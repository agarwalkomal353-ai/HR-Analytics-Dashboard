<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HR Analytics Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0D16; --bg-2:#0E1220; --surface:#141A29; --surface-2:#1B2337;
  --line:#262F45; --line-soft:#1D2437;
  --ink:#F3F5FA; --ink-2:#C2C9DA; --muted:#8992A8;
  --purple:#9161F5; --blue:#4EA0F7; --purple-soft:rgba(145,97,245,.16);
  --stay:#4EA0F7; --leave:#9161F5; --rule:#3A4258;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px);overflow:hidden}
body{
  margin:0; overflow:hidden;
  background:
    radial-gradient(1200px 560px at 100% -12%, rgba(145,97,245,.14), transparent 60%),
    radial-gradient(1000px 560px at -10% 112%, rgba(78,160,247,.10), transparent 55%),
    var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:13.5px; line-height:1.35; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;margin:0}

/* ---------- page shell ---------- */
.wrap{
  height:100vh; height:100dvh; max-height:100vh;
  display:grid; grid-template-rows:auto 1fr;
  gap:10px; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  max-width:1680px; margin:0 auto; min-height:0;
}
.content{display:grid; grid-template-columns:184px 1fr; gap:12px; min-height:0}

/* ---------- header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  background:linear-gradient(120deg, var(--bg-2), var(--surface) 60%, var(--surface-2));
  border:1px solid var(--line); border-bottom:2px solid transparent;
  border-image:linear-gradient(90deg,var(--purple),var(--blue)) 1;
  border-radius:9px; padding:10px 20px; flex:none;
}
h1{font-size:20px; line-height:1.1; letter-spacing:-.01em; color:var(--ink)}
.matchline{font-size:11.5px; color:var(--ink-2); margin:0; white-space:nowrap}
.matchline b{color:var(--purple); font-weight:600}

/* ---------- filter rail ---------- */
.rail{
  min-height:0; overflow-y:auto; display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  padding:11px 12px; box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.rail-head{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:7px}
.rail-head h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Sans",sans-serif}
.reset{background:none;border:none;color:var(--purple);font:inherit;font-size:11px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.reset:disabled{color:var(--muted);text-decoration:none;cursor:default}
details.f{border-top:1px solid var(--line-soft);padding:5px 0}
details.f:first-of-type{border-top:none}
details.f>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11.8px;font-weight:500;color:var(--ink-2);padding:2px 0}
details.f>summary::-webkit-details-marker{display:none}
details.f>summary::after{content:"+";color:var(--muted);font-size:12px;line-height:1}
details.f[open]>summary::after{content:"–"}
.tag{background:var(--purple);color:#fff;border-radius:999px;font-size:9.5px;padding:1px 5px;font-weight:600}
.opts{padding:3px 0 2px; max-height:120px; overflow-y:auto}
.opt{display:flex;align-items:center;gap:6px;font-size:11.3px;color:var(--ink-2);padding:2px 0;cursor:pointer}
.opt input{accent-color:var(--purple);width:12px;height:12px;margin:0;flex:none}
.opt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt small{margin-left:auto;color:var(--muted);font-size:10px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;flex:none}
.kpi{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:11px 14px 10px;border-left:3px solid var(--rule);
  box-shadow:0 2px 10px rgba(0,0,0,.22);
}
.kpi.alert{border-left-color:var(--purple)}
.kpi .v{font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.kpi.alert .v{color:var(--purple)}
.kpi .k{font-size:10.8px;color:var(--muted);margin-top:3px;font-weight:500;letter-spacing:.01em}

/* ---------- main column ---------- */
.main-col{display:grid; grid-template-rows:auto auto 1fr; gap:10px; min-height:0}

/* ---------- charts grid ---------- */
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:10px;min-height:0}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:11px 15px 12px;min-width:0;min-height:0;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.22);
}
.card h3{font-size:12.8px;font-family:"IBM Plex Sans",sans-serif;font-weight:600;color:var(--ink);flex:none;
  border-bottom:1px solid var(--line-soft);padding-bottom:7px;margin-bottom:7px;letter-spacing:.01em}
.chart-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------- horizontal bars ---------- */
.hbars{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;overflow:hidden}
.hrow{display:grid;grid-template-columns:minmax(78px,34%) 1fr auto;align-items:center;gap:9px;padding:2px 0;cursor:pointer;border-radius:3px}
.hrow:hover .track,.hrow:focus-visible .track{background:var(--surface-2)}
.hrow:focus-visible{outline:2px solid var(--purple);outline-offset:1px}
.hrow.on .lbl{color:var(--purple);font-weight:600}
.lbl{font-size:12.3px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--surface-2);height:15px;border-radius:3px;overflow:hidden;min-width:10px}
.fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--blue));border-radius:3px 0 0 3px}
.val{font-size:12px;font-weight:600;min-width:74px;text-align:right;color:var(--ink)}
.val em{font-style:normal;font-weight:400;color:var(--muted);font-size:10.6px}

/* ---------- column charts ---------- */
.cols-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.cols{display:flex;align-items:flex-end;gap:12px;flex:1;min-height:0;border-bottom:1px solid var(--line);position:relative}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;cursor:pointer;min-width:0}
.col .bar{width:100%;max-width:62px;background:linear-gradient(180deg,var(--purple),var(--blue));border-radius:4px 4px 0 0;transition:opacity .15s}
.col:hover .bar{opacity:.8}
.col .pct{font-size:12.5px;font-weight:600;margin-bottom:3px;color:var(--ink)}
.xlabels{display:flex;gap:12px;margin-top:6px;flex:none}
.xlabels div{flex:1;text-align:center;font-size:11px;color:var(--muted);line-height:1.2;min-width:0;word-break:break-word}
.refline{position:absolute;left:0;right:0;border-top:1px dashed var(--rule);pointer-events:none}
.refline span{position:absolute;right:0;top:-14px;font-size:9.6px;color:var(--muted);background:var(--surface);padding:0 4px}

/* ---------- donut block ---------- */
.overall{display:flex;align-items:center;justify-content:center;gap:22px;flex:1;min-height:0}
.donut{flex:none;display:flex;align-items:center}
.donut svg{width:auto;height:100%;max-height:100%}
.legend{font-size:12.5px;display:grid;gap:11px;min-width:120px}
.legend div{display:flex;align-items:baseline;gap:8px}
.dot{width:9px;height:9px;border-radius:2px;flex:none;transform:translateY(1px)}
.legend b{font-size:16.5px;font-weight:600;color:var(--ink)}
.legend small{color:var(--muted);font-size:10.8px}

/* ---------- notice & empty ---------- */
.notice{background:var(--purple-soft);border:1px solid var(--purple);border-radius:7px;padding:6px 12px;font-size:11.3px;color:var(--ink);flex:none}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:9px;padding:22px;text-align:center;color:var(--ink-2)}
.empty b{display:block;margin-bottom:4px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>HR Analytics Dashboard</h1>
  <p class="matchline" id="matchline"></p>
</header>

<div class="content">
  <aside class="rail" aria-label="Filters">
    <div class="rail-head">
      <h2>Filters</h2>
      <button class="reset" id="reset" disabled>Clear all</button>
    </div>
    <div id="filters"></div>
  </aside>

  <div class="main-col">
    <div id="notice"></div>
    <div class="kpis" id="kpis"></div>
    <div id="body"></div>
  </div>
</div>
</div>

const band=(v,cuts,names)=>{for(let i=0;i<cuts.length;i++) if(v<=cuts[i]) return names[i]; return names[names.length-1];};

const rows = raw.map(r=>({
  left: r[COLS.Attrition]===1,

const scale=['1 — Low','2','3','4 — High'];
const scaleOf=n=>scale[n-1];

// ---- filters -------------------------------------------------------------
const FILTERS=[
  {key:'Department', label:'Department'},
  {key:'JobRole', label:'Job role'},
  {key:'OverTime', label:'Overtime'},
  {key:'BusinessTravel', label:'Business travel'},
  {key:'JobLevel', label:'Job level'},
  {key:'AgeGroup', label:'Age group', order:ageBands},
  {key:'Gender', label:'Gender'},
  {key:'MaritalStatus', label:'Marital status'},
  {key:'EducationField', label:'Education field'},
  {key:'Attrition', label:'Attrition'}
];
const state={}; FILTERS.forEach(f=>state[f.key]=new Set());

function filtered(){
  return rows.filter(r=>FILTERS.every(f=>state[f.key].size===0||state[f.key].has(r[f.key])));
}
function buildFilters(){
  const host=document.getElementById('filters'); host.innerHTML='';
  FILTERS.forEach(f=>{
    const opts=uniqOrder(r=>r[f.key],f.order);
    const d=document.createElement('details'); d.className='f'; d.dataset.key=f.key;
    if(state[f.key].size) d.open=true;
    const n=state[f.key].size;
    d.innerHTML='<summary><span>'+f.label+(n?' <span class="tag">'+n+'</span>':'')+'</span></summary>';
    const box=document.createElement('div'); box.className='opts';
    opts.forEach(o=>{
      const count=rows.filter(r=>r[f.key]===o).length;
      const l=document.createElement('label'); l.className='opt';
      const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=state[f.key].has(o);
      cb.addEventListener('change',()=>{cb.checked?state[f.key].add(o):state[f.key].delete(o);render();});
      const s=document.createElement('span'); s.textContent=o;
      const sm=document.createElement('small'); sm.textContent=count;
      l.append(cb,s,sm); box.appendChild(l);
    });
    d.appendChild(box); host.appendChild(d);
  });
}
document.getElementById('reset').addEventListener('click',()=>{FILTERS.forEach(f=>state[f.key].clear());buildFilters();render();});

// ---- chart builders ------------------------------------------------------
const pct=(a,b)=>b?(a/b*100):0;
const fmt1=v=>v.toFixed(1);
const money=v=>'$'+Math.round(v).toLocaleString('en-US');

function groups(data,field,order){
  const keys=order||[...new Set(rows.map(r=>r[field]))].sort();
  return keys.map(k=>{const sub=data.filter(r=>r[field]===k);
    return {k,n:sub.length,left:sub.filter(r=>r.left).length};})
    .map(g=>({...g,rate:pct(g.left,g.n)}));
}
function hbars(g,overall,filterKey,sort){
  if(sort) g=[...g].sort((a,b)=>b.rate-a.rate);
  const max=Math.max(...g.map(x=>x.rate),overall,1)*1.08;
  const el=document.createElement('div'); el.className='hbars';
  g.forEach(x=>{
    const row=document.createElement('div'); row.className='hrow';
    if(filterKey&&state[filterKey]&&state[filterKey].has(x.k)) row.classList.add('on');
    row.innerHTML='<div class="lbl">'+x.k+'</div><div class="track"><div class="fill" style="width:'+
      (x.n?(x.rate/max*100):0)+'%"></div></div><div class="val">'+(x.n?fmt1(x.rate)+'%':'—')+
      ' <em>'+x.left+'/'+x.n+'</em></div>';
    row.title=x.k+': '+x.left+' of '+x.n+' employees left';
    if(filterKey){
      row.tabIndex=0; row.setAttribute('role','button');
      const toggle=()=>{state[filterKey].has(x.k)?state[filterKey].delete(x.k):state[filterKey].add(x.k);buildFilters();render();};
      row.addEventListener('click',toggle);
      row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
    } else row.style.cursor='default';
    el.appendChild(row);
  });
  return el;
}
function cols(g,overall,filterKey){
  const max=Math.max(...g.map(x=>x.rate),overall,1)*1.15;
  const wrap=document.createElement('div'); wrap.className='cols-wrap';
  const c=document.createElement('div'); c.className='cols';
  g.forEach(x=>{
    const col=document.createElement('div'); col.className='col';
    col.title=x.k+': '+x.left+' of '+x.n+' employees left';
    col.innerHTML='<div class="pct">'+(x.n?fmt1(x.rate)+'%':'—')+'</div><div class="bar" style="height:'+
      (x.n?Math.max(x.rate/max*100,1):0)+'%"></div>';
    if(filterKey){col.addEventListener('click',()=>{state[filterKey].has(x.k)?state[filterKey].delete(x.k):state[filterKey].add(x.k);buildFilters();render();});}
    else col.style.cursor='default';
    c.appendChild(col);
  });
  const ref=document.createElement('div'); ref.className='refline';
  ref.style.bottom=(overall/max*100)+'%';
  ref.innerHTML='<span>avg '+fmt1(overall)+'%</span>';
  c.appendChild(ref);
  const xl=document.createElement('div'); xl.className='xlabels';
  g.forEach(x=>{const d=document.createElement('div');d.textContent=x.k+' (n='+x.n+')';xl.appendChild(d);});
  wrap.append(c,xl); return wrap;
}
function card(title,node,span){
  const c=document.createElement('div'); c.className='card'+(span?' span2':'');
  const h=document.createElement('h3'); h.textContent=title;
  const b=document.createElement('div'); b.className='chart-body'; b.appendChild(node);
  c.append(h,b); return c;
}

  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 150 150');
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label',left+' of '+total+' employees left the company');
  const mk=(color,dash,off)=>{const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',75);c.setAttribute('cy',75);c.setAttribute('r',r);c.setAttribute('fill','none');
    c.setAttribute('stroke',color);c.setAttribute('stroke-width',20);c.setAttribute('stroke-linecap','round');
    c.setAttribute('stroke-dasharray',dash);c.setAttribute('stroke-dashoffset',off);
    c.setAttribute('transform','rotate(-90 75 75)');return c;};
  svg.appendChild(mk(getComputedStyle(document.body).getPropertyValue('--stay'),C,0));
  svg.appendChild(mk(getComputedStyle(document.body).getPropertyValue('--leave'),(C*frac)+' '+C,0));
  const t=document.createElementNS(ns,'text');
  t.setAttribute('x',75);t.setAttribute('y',73);t.setAttribute('text-anchor','middle');
  t.setAttribute('font-size','27');t.setAttribute('font-weight','700');t.setAttribute('font-family','IBM Plex Sans, sans-serif');
  t.setAttribute('fill',getComputedStyle(document.body).getPropertyValue('--ink'));
  t.textContent=fmt1(frac*100)+'%';
  svg.appendChild(t);
  const t2=document.createElementNS(ns,'text');
  t2.setAttribute('x',75);t2.setAttribute('y',92);t2.setAttribute('text-anchor','middle');
  t2.setAttribute('font-size','10.5');t2.setAttribute('font-weight','500');t2.setAttribute('font-family','IBM Plex Sans, sans-serif');
  t2.setAttribute('letter-spacing','.04em');
  t2.setAttribute('fill',getComputedStyle(document.body).getPropertyValue('--muted'));
  t2.textContent='ATTRITION RATE';
  svg.appendChild(t2);
  const box=document.createElement('div'); box.className='overall';
  const d=document.createElement('div'); d.className='donut'; d.appendChild(svg);
  const leg=document.createElement('div'); leg.className='legend';
  leg.innerHTML='<div><span class="dot" style="background:var(--leave)"></span><div><b>'+left.toLocaleString()+
    '</b> Left<br><small>'+fmt1(frac*100)+'% of employees</small></div></div>'+
    '<div><span class="dot" style="background:var(--stay)"></span><div><b>'+(total-left).toLocaleString()+
    '</b> Stayed<br><small>'+fmt1(100-frac*100)+'% of employees</small></div></div>';
  box.append(d,leg); return box;
}
// ---- render --------------------------------------------------------------
function render(){
  const data=filtered(), total=data.length, left=data.filter(r=>r.left).length, rate=pct(left,total);
  const active=FILTERS.filter(f=>state[f.key].size);
  document.getElementById('reset').disabled=!active.length;
  document.getElementById('matchline').innerHTML= active.length
    ? '<b>'+total.toLocaleString()+'</b> of 1,470 employees match '+active.length+' filter'+(active.length>1?'s':'')
    : 'Showing all <b>1,470</b> employees';

  const notice=document.getElementById('notice');
  notice.innerHTML = state.Attrition.size===1
    ? '<div class="notice">Attrition filter active — rates below are 0% or 100% by definition.</div>' : '';

  const k=document.getElementById('kpis');
  const avg=f=>total?data.reduce((s,r)=>s+f(r),0)/total:NaN;
  const kpi=(v,lab,alert)=>'<div class="kpi'+(alert?' alert':'')+'"><div class="v">'+v+'</div><div class="k">'+lab+'</div></div>';
  k.innerHTML = total===0 ? '' : [
    kpi(total.toLocaleString(),'Total Employees'),
    kpi(left.toLocaleString(),'Attrition Count',true),
    kpi(fmt1(rate)+'%','Attrition Rate',true),
    kpi(avg(r=>r.Age).toFixed(1),'Average Age'),
    kpi(money(avg(r=>r.MonthlyIncome)),'Average Monthly Income'),
    kpi(avg(r=>r.YearsAtCompany).toFixed(1),'Average Years at Company')
  ].join('');

  const body=document.getElementById('body');
  body.innerHTML=''; body.className='grid';
  if(total===0){
    body.className='';
    body.innerHTML='<div class="empty"><b>No employees match these filters.</b>Clear one or more filters to bring records back.</div>';
    return;
  }
  const g=(field,order)=>groups(data,field,order);

  [
    card('Stayed vs left',donut(left,total)),
    card('Attrition rate by department',hbars(g('Department'),rate,'Department',true)),
    card('Overtime and attrition',hbars(g('OverTime'),rate,'OverTime',true)),
    card('Attrition rate by job role',hbars(g('JobRole'),rate,'JobRole',true)),
    card('Attrition rate by job level',hbars(g('JobLevel'),rate,'JobLevel')),
    card('Attrition rate by business travel',hbars(g('BusinessTravel'),rate,'BusinessTravel',true)),
    card('Job satisfaction',cols(groups(data,'JobSatisfaction',[1,2,3,4]).map(x=>({...x,k:scaleOf(x.k)})),rate)),
    card('Work-life balance',cols(groups(data,'WorkLifeBalance',[1,2,3,4]).map(x=>({...x,k:scaleOf(x.k)})),rate))
  ].forEach(c=>body.appendChild(c));
}

buildFilters(); render();
</script>
